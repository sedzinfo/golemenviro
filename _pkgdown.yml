url: https://sedzinfo.github.io/golemenviro/

template:
  bootstrap: 5
  bootswatch: flatly
  math-rendering: katex   # renders the \eqn and \deqn maths of the help pages
  includes:
    # cookie banner and Google Analytics, shared by every site under sedzinfo.github.io (consent.js in that repository)
    after_body: '<script src="/consent.js" defer></script>'
  # end of the meta description of the pages pkgdown leaves without one (reference, article and
  # news indexes, authors, licence, 404): "<page title> – <package>: <tagline>", written by
  # pkgdown/templates/in-header.html; the other pages keep their own description
  params:
    tagline: "Real-Time Visualization of Pimoroni Enviro Sensor Data from Prometheus"
  # the preview card that LinkedIn, Bluesky, Mastodon, Slack and others show when a page is shared:
  # pkgdown/assets/card.png (1200x630), which pkgdown copies to the root of the site
  opengraph:
    image:
      src: card.png
      alt: "golemenviro: Real-Time Visualization of Pimoroni Enviro Sensor Data from Prometheus, with gauges of the latest reading of each sensor"

code:
  width: 200

destination: docs

# the vignettes, which r-universe shows too, in the order to read them
articles:
  - title: Charts in R
    navbar: ~
    contents:
      - golemenviro
      - daily-pattern
      - air-quality

navbar:
  structure:
    left: [intro, reference, articles]
    right: [app, sedzinfo, github]
  components:
    app:
      icon: fas fa-play
      text: live app
      href: https://sedzinfo-golemenviro.share.connect.posit.cloud/
      aria-label: Open the live app
    sedzinfo:
      icon: fas fa-house
      text: home
      href: https://sedzinfo.github.io/
      aria-label: sedzinfo home page
    github:
      icon: fab fa-github
      href: https://github.com/sedzinfo/golemenviro
      aria-label: GitHub

footer:
  structure:
    left: sedzinfo
    right: sedzinfo_home
  components:
    sedzinfo: '[github.com/sedzinfo](https://github.com/sedzinfo) · [Cookie settings](#cookie-settings)'
    sedzinfo_home: '[home](https://sedzinfo.github.io/)'
